<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Wind Field Visualization</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <style>
    html, body, #map {
      height: 100%; margin: 0; padding: 0;
    }
    .control {
      position: absolute;
      top: 10px; left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: white;
      padding: 8px;
      border-radius: 5px;
      box-shadow: 0 0 5px rgba(0,0,0,0.3);
      font-family: sans-serif;
    }
    select {
      margin: 0 5px;
    }
  </style>
</head>
<body>
  <div class="control">
    <label>季節：
      <select id="season">
        <option value="DJF">冬季</option>
        <option value="JJA">夏季</option>
      </select>
    </label>
    <label>時間：
      <select id="time">
        <option value="day">白天</option>
        <option value="night">夜晚</option>
        <option value="avg">平均</option>
      </select>
    </label>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-velocity/dist/leaflet-velocity.min.js"></script>
  <script>
  const map = L.map('map', {
    minZoom: 8,
    maxZoom: 12,
    center: [23.7, 121],
    zoom: 8
  });

  L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Esri, Maxar, Earthstar Geographics',
    maxZoom: 20
  }).addTo(map);

  // === DEM 地形切圖圖層 ===
  const demLayer = L.tileLayer('tiles_dem/{z}/{x}/{y}.png', {
    opacity: 0.8,
    minZoom: 8,
    maxZoom: 12,
    attribution: 'DEM'
  }).addTo(map);

  // === 建立圖層控制器 ===
  const baseMaps = {
    "衛星底圖": map._layers[Object.keys(map._layers)[0]]  // 預設底圖
  };

  const overlayMaps = {
    "地形圖層": demLayer
  };

  // 圖層控制器加到右上角
  const layerControl = L.control.layers(baseMaps, overlayMaps, {
    collapsed: false,
    position: 'topright'
  }).addTo(map);


  let velocityLayer;
  let currentData = null;

  function getDisplayOptions(zoom) {
  if (zoom < 9) {
    return {
      lineWidth: 1.5,
      particleAge: 30,
      particlesMultiplier: 0.15,
      maxVelocity: 18,
      velocityScale: 0.006
    };
  } else if (zoom < 10) {
    return {
      lineWidth: 1.5,
      particleAge: 45,
      particlesMultiplier: 0.3,
      maxVelocity: 18,
      velocityScale: 0.01
    };
  } else if (zoom < 11) {
    return {
      lineWidth: 1.5,
      particleAge: 60,
      particlesMultiplier: 0.5,
      maxVelocity: 18,
      velocityScale: 0.015
    };
  } else if (zoom < 12) {
    return {
      lineWidth: 1.5,
      particleAge: 80,
      particlesMultiplier: 0.8,
      maxVelocity: 18,
      velocityScale: 0.018
    };
  } else {
    return {
      lineWidth: 2.2,
      particleAge: 100,
      particlesMultiplier: 1.0,
      maxVelocity: 4,
      velocityScale: 0.02
    };
  }
  }

  function loadVelocityData(season, time) {
    const zoom = map.getZoom();
    let res = "native";
    if (zoom < 9.2) res = "4x4";
    else if (zoom < 11) res = "3x3";

    const url = `wind_${season}_${time}_${res}.json`;

    fetch(url)
      .then(response => response.json())
      .then(data => {
        currentData = data;
        drawVelocityLayer();
      })
      .catch(err => console.error("❌ Windy data load failed:", err));
  }

  function drawVelocityLayer() {
    const zoom = map.getZoom();
    const {
      lineWidth,
      particleAge,
      particlesMultiplier,
      maxVelocity,
      velocityScale
    } = getDisplayOptions(zoom);

    if (velocityLayer) {
      map.removeLayer(velocityLayer);
      layerControl.removeLayer(velocityLayer);
    }

    velocityLayer = L.velocityLayer({
      displayValues: true,
      displayOptions: {
        velocityType: '風速',
        position: 'bottomleft',
        emptyString: 'No wind data'
      },
      data: currentData,
      maxVelocity,
      minVelocity: 0.01,
      velocityScale,
      lineWidth,
      particleAge,
      particlesMultiplier
    });

    velocityLayer.addTo(map);
    layerControl.addOverlay(velocityLayer, '風場圖層');
  }


  const seasonSelect = document.getElementById('season');
  const timeSelect = document.getElementById('time');

  function update() {
    loadVelocityData(seasonSelect.value, timeSelect.value);
  }

  seasonSelect.onchange = update;
  timeSelect.onchange = update;

  map.on('zoomend', () => {
    if (currentData) drawVelocityLayer();
    else update();
  });

  update();
</script>

</body>
</html>
